[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spendlint"
dynamic = ["version"]
description = "Static cost-defect checks for LLM agent code (Python and TypeScript), with SARIF and GitHub Actions output."
readme = "README.md"
license = "PolyForm-Small-Business-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Ishan Upadhyay" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["llm", "agents", "cost", "lint", "static-analysis", "prompt-caching"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Software Development :: Quality Assurance",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# Full YAML for .spendlint.yml. Without it a built-in reader handles the flat subset the config uses.
yaml = ["PyYAML>=5.1"]

[project.scripts]
spendlint = "spendlint.__main__:main"

[tool.setuptools]
packages = ["spendlint"]

[tool.setuptools.dynamic]
version = { attr = "spendlint.__version__" }

[project.urls]
Homepage = "https://github.com/ishan121028/spendlint"
Issues = "https://github.com/ishan121028/spendlint/issues"
