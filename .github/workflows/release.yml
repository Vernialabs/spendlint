# Publishes spendlint to PyPI when a GitHub release is published.
# Uses PyPI trusted publishing (OpenID Connect): no API token or password is stored anywhere.
# One-time setup on https://pypi.org/manage/account/publishing/ (pending publisher):
#   PyPI project name: spendlint   Owner: Vernialabs   Repository: spendlint
#   Workflow name: release.yml     Environment name: pypi
name: release
on:
  release:
    types: [published]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Run tests
        run: |
          python -m spendlint.test_rules
          python -m unittest spendlint.test_cli spendlint.test_telemetry
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import spendlint; print(spendlint.__version__)")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then echo "::error::tag $GITHUB_REF_NAME does not match version $version"; exit 1; fi
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/spendlint/
    permissions:
      id-token: write  # required for trusted publishing; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
