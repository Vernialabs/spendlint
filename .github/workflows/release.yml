# Publishes spendlint to PyPI when a GitHub release is published.
# Uses PyPI trusted publishing (OpenID Connect): no API token or password is stored anywhere.
# One-time setup on https://pypi.org/manage/account/publishing/ (pending publisher):
#   PyPI project name: spendlint   Owner: Vernialabs   Repository: spendlint
#   Workflow name: release.yml     Environment name: pypi
name: release
on:
  release:
    types: [published]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.14"
          enable-cache: false
      - run: uv sync --locked --group dev
      - name: Run tests
        run: uv run --no-sync pytest
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(uv run --no-sync python -c "import spendlint; print(spendlint.__version__)")
          if [ "$version" != "${TAG#v}" ]; then echo "::error::tag $TAG does not match version $version"; exit 1; fi
      - name: Build sdist and wheel
        run: |
          uv build
          uv run --no-sync twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/spendlint/
    permissions:
      id-token: write  # required for trusted publishing; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
