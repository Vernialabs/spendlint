# Tests, lint and workflow checks on every pull request and on pushes to main.
name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uv run --no-sync pytest --cov --cov-report=term
      - run: uv run --no-sync spendlint --version

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.14"
      - run: uv sync --locked --group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pyright

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.14"
      - name: actionlint
        run: uvx --from actionlint-py==1.7.12.25 actionlint
      - name: zizmor
        run: uvx zizmor==1.31.1 --min-severity medium .
        env:
          GH_TOKEN: ${{ github.token }}

  # Runs the Action from this checkout, the way users run vernialabs/spendlint@v0, so a broken
  # action.yml or install/scan script fails here before it is tagged.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: spendlint (this checkout)
        id: spendlint
        uses: ./
        with:
          path: spendlint
          diff-mode: off
          fail-on: none
      - name: Check the outputs
        env:
          FINDINGS: ${{ steps.spendlint.outputs.findings-count }}
          EXIT_CODE: ${{ steps.spendlint.outputs.exit-code }}
        run: |
          echo "findings=$FINDINGS exit-code=$EXIT_CODE"
          test -n "$FINDINGS" && test "$EXIT_CODE" = "0"
