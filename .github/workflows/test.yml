# Runs the test suites on every push and pull request, on Linux, macOS and Windows.
name: test
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m spendlint.test_rules
      - run: python -m unittest spendlint.test_cli spendlint.test_telemetry
      - run: python -m pip install . && spendlint --version
